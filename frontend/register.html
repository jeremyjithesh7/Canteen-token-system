<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Smart Campus Canteen OS</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--bg-body);">

    <div class="container" style="max-width: 460px; padding: var(--space-6) var(--space-4);">
        <div style="text-align:center; margin-bottom: var(--space-5);">
            <div class="brand-icon" style="margin: 0 auto var(--space-3); width:44px; height:44px; font-size:1.25rem;"><i class="fa-solid fa-utensils"></i></div>
            <h1 style="font-size: 1.65rem; font-weight: 700; font-family:var(--font-heading); margin-bottom:var(--space-1);">Create Account</h1>
            <p style="color: var(--text-secondary); font-size: 0.875rem;">Join the smart campus digital canteen</p>
        </div>

        <div class="card" style="padding:var(--space-5);">
            <form id="register-form" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label class="form-label" for="reg-name">Full Name</label>
                    <input type="text" id="reg-name" class="form-control" placeholder="e.g. John Doe" required />
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-email">Campus Email</label>
                    <input type="email" id="reg-email" class="form-control" placeholder="john@canteen.edu" required />
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-phone">Phone Number (Optional)</label>
                    <input type="tel" id="reg-phone" class="form-control" placeholder="+91 98765 43210" />
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-dept">Department / Major</label>
                    <input type="text" id="reg-dept" class="form-control" placeholder="e.g. Computer Science" />
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-password">Password (min. 6 chars)</label>
                    <input type="password" id="reg-password" class="form-control" placeholder="••••••••" minlength="6" required />
                </div>

                <button type="submit" id="reg-btn" class="btn btn-primary" style="width:100%; margin-top:var(--space-2);">
                    <i class="fa-solid fa-user-plus"></i> Sign Up & Get Token Access
                </button>
            </form>
        </div>

        <div style="text-align:center; margin-top: var(--space-4); font-size: 0.875rem; color: var(--text-secondary);">
            Already have an account? <a href="/login.html" style="color:var(--primary-hover); font-weight:600;">Sign in here</a>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/notifications.js"></script>
    <script>
        async function handleRegister(e) {
            e.preventDefault();
            const btn = document.getElementById('reg-btn');
            const userData = {
                name: document.getElementById('reg-name').value.trim(),
                email: document.getElementById('reg-email').value.trim(),
                phone: document.getElementById('reg-phone').value.trim() || null,
                department: document.getElementById('reg-dept').value.trim() || null,
                password: document.getElementById('reg-password').value,
                role_id: 3 // Student
            };

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Creating account...';

            try {
                const data = await Auth.register(userData);
                Toast.success(`Welcome to Canteen OS, ${data.user.name}!`);
                setTimeout(() => {
                    window.location.href = '/dashboard.html';
                }, 400);
            } catch (err) {
                Toast.error(err.message || 'Registration failed.');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Sign Up & Get Token Access';
            }
        }
    </script>
</body>
</html>
