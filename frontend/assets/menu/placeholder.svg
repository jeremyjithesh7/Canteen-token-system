<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="neonBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140728"/>
      <stop offset="50%" stop-color="#210c42"/>
      <stop offset="100%" stop-color="#0a0118"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b026ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#b026ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#neonBg)"/>
  <circle cx="300" cy="200" r="180" fill="url(#glow)"/>
  <!-- Decorative Ring -->
  <circle cx="300" cy="180" r="70" fill="none" stroke="#b026ff" stroke-width="3" stroke-dasharray="8 6" opacity="0.6"/>
  <!-- Food / Plate Icon -->
  <circle cx="300" cy="180" r="50" fill="#1c0a3a" stroke="#00e5ff" stroke-width="2"/>
  <text x="300" y="195" font-family="'Orbitron', sans-serif" font-size="38" text-anchor="middle" fill="#ff2ee6">🍽️</text>
  <!-- Text Label -->
  <text x="300" y="290" font-family="'Orbitron', sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#00e5ff" letter-spacing="2">SOUTH INDIAN SPECIALTY</text>
  <text x="300" y="320" font-family="'Space Grotesk', sans-serif" font-size="14" text-anchor="middle" fill="#a094b8">Freshly Prepared on Order</text>
</svg>
